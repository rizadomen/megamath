<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FB923C">
  <link rel="icon" type="image/png" href="favicon-megamath.png">
  <link rel="apple-touch-icon" href="favicon-megamath.png">
  <title>Pengaturan Landing Page - Mega Math</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FFFDF9] text-slate-800 px-3 py-4 sm:p-6">

  <!-- LOADER -->
  <div id="loader" class="fixed inset-0 bg-[#FFFDF9]/85 backdrop-blur-sm z-50 hidden flex-col items-center justify-center px-4">
    <div class="w-11 h-11 border-4 border-orange-200 border-t-orange-500 rounded-full animate-spin"></div>
    <p id="loader-text" class="mt-3 text-xs sm:text-sm font-bold text-orange-600">Memproses...</p>
  </div>

  <!-- MODAL NOTIF -->
  <div id="modal-notif" class="fixed inset-0 bg-slate-900/45 z-50 hidden items-center justify-center p-3 sm:p-4">
    <div class="w-full max-w-sm bg-white border-[1.5px] border-orange-200 shadow-xl rounded-3xl p-5 sm:p-6 text-center space-y-4">
      <div id="notif-icon" class="text-4xl">✨</div>
      <h3 id="notif-title" class="text-base sm:text-lg font-extrabold text-slate-800">Informasi</h3>
      <p id="notif-message" class="text-xs text-slate-600 leading-relaxed font-semibold">-</p>
      <button type="button" id="btn-tutup-notif"
        class="w-full bg-gradient-to-br from-orange-400 to-orange-600 hover:from-orange-500 hover:to-orange-700 text-white font-extrabold text-sm py-3 rounded-2xl shadow-md shadow-orange-500/25 transition">
        Oke, Mengerti
      </button>
    </div>
  </div>

  <!-- FORM LOGIN ADMIN (SAMA DENGAN FORM LOGIN ADMIN.HTML) -->
  <div id="view-login-admin" class="min-h-[82vh] flex items-center justify-center px-1">
    <div class="w-full max-w-md bg-white border-[1.5px] border-orange-100 shadow-xl shadow-orange-500/10 rounded-3xl p-6 sm:p-8 space-y-6">
      <div class="text-center space-y-2">
        <div class="w-40 h-16 mx-auto flex items-center justify-center">
          <img src="logo-megamath.png" alt="Logo Mega Math" class="w-full h-full object-contain mix-blend-multiply">
        </div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800">Login Panel Admin</h1>
        <p class="text-xs font-bold text-slate-500">Masuk untuk mengelola Pengaturan Landing Page Mega Math</p>
      </div>

      <form id="form-login-admin" class="space-y-4 text-xs sm:text-sm">
        <div>
          <label class="block text-xs font-extrabold text-slate-700 mb-1.5">ID Admin</label>
          <input type="text" id="admin-id-input" required autocomplete="username" placeholder="ID ADMIN (MISAL: ADMIN01)"
            class="w-full px-4 py-3 rounded-2xl bg-white border border-orange-200 font-extrabold text-slate-800 uppercase focus:outline-none focus:border-orange-400">
        </div>

        <div>
          <label class="block text-xs font-extrabold text-slate-700 mb-1.5">Password Admin</label>
          <input type="password" id="admin-pass-input" required autocomplete="current-password" placeholder="Masukkan password admin"
            class="w-full px-4 py-3 rounded-2xl bg-white border border-orange-200 font-bold text-slate-800 focus:outline-none focus:border-orange-400">
        </div>

        <p id="admin-login-error" class="text-xs font-bold text-rose-500 hidden"></p>

        <button type="submit"
          class="w-full bg-gradient-to-br from-orange-400 to-orange-600 hover:from-orange-500 hover:to-orange-700 active:scale-[0.98] text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-lg shadow-orange-500/30 transition">
          Masuk ke Pengaturan Landing →
        </button>
      </form>

      <div class="pt-3 border-t border-orange-100 flex items-center justify-between text-xs font-extrabold">
        <a href="admin.html" class="text-orange-600 hover:underline">← Ke Dashboard Admin</a>
        <a href="index.html" class="text-slate-500 hover:text-orange-600">Halaman Depan</a>
      </div>
    </div>
  </div>

  <!-- KONTEN PENGATURAN LANDING PAGE -->
  <div id="view-pengaturan-landing" class="max-w-3xl mx-auto space-y-4 pb-12 hidden">

    <!-- HEADER -->
    <div class="bg-white border-[1.5px] border-orange-100 shadow-lg shadow-orange-500/5 rounded-3xl p-4 sm:p-5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <img src="favicon-megamath.png" alt="Mega Math" class="w-11 h-9 object-contain mix-blend-multiply shrink-0">
        <div class="min-w-0">
          <h1 class="text-base sm:text-xl font-extrabold text-slate-800 truncate">Pengaturan Landing Page</h1>
          <p id="admin-session-info" class="text-[11px] sm:text-xs font-bold text-orange-600 truncate">-</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2 shrink-0">
        <a href="index.html" target="_blank" rel="noopener noreferrer"
          class="text-xs font-extrabold px-3 py-2 rounded-xl border border-orange-200 text-orange-600 bg-orange-50/60 hover:bg-orange-100 transition">
          Lihat Landing ↗
        </a>
        <a href="admin.html"
          class="text-xs font-extrabold px-3.5 py-2 rounded-xl border border-orange-200 text-slate-700 bg-white hover:bg-orange-50 transition">
          ← Panel Admin
        </a>
        <button type="button" id="btn-logout-admin"
          class="text-xs font-extrabold px-3 py-2 rounded-xl border border-rose-200 text-rose-600 bg-rose-50/70 hover:bg-rose-100 transition">
          Keluar
        </button>
      </div>
    </div>

    <!-- FORM PENGATURAN HERO & PAKET -->
    <form id="form-landing-setting" class="bg-white border-[1.5px] border-orange-100 shadow-lg shadow-orange-500/5 rounded-3xl p-4 sm:p-6 space-y-6 text-xs">

      <div class="space-y-3 border-b border-orange-100 pb-5">
        <h2 class="text-xs font-extrabold uppercase tracking-wide text-orange-600">🎯 BAGIAN HERO &amp; PESAN WA</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-600 mb-1">Badge Promo Atas</label>
            <input type="text" id="set-badge-promo" required
              class="w-full px-3.5 py-2.5 rounded-2xl bg-white border border-orange-200 font-bold text-slate-800 focus:outline-none focus:border-orange-400">
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-1">Pesan Default Tombol Tanya Admin</label>
            <input type="text" id="set-cta-wa" required
              class="w-full px-3.5 py-2.5 rounded-2xl bg-white border border-orange-200 font-bold text-slate-800 focus:outline-none focus:border-orange-400">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-600 mb-1">Judul Utama Hero</label>
          <input type="text" id="set-judul-hero" required
            class="w-full px-3.5 py-2.5 rounded-2xl bg-white border border-orange-200 font-extrabold text-sm text-slate-800 focus:outline-none focus:border-orange-400">
        </div>

        <div>
          <label class="block font-bold text-slate-600 mb-1">Subjudul / Deskripsi Singkat</label>
          <textarea id="set-subjudul-hero" rows="2" required
            class="w-full px-3.5 py-2.5 rounded-2xl bg-white border border-orange-200 font-semibold text-slate-800 focus:outline-none focus:border-orange-400"></textarea>
        </div>
      </div>

      <!-- DAFTAR PAKET -->
      <div class="space-y-3">
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-xs font-extrabold uppercase tracking-wide text-orange-600">💳 DAFTAR PAKET &amp; HARGA</h2>
          <button type="button" id="btn-tambah-paket"
            class="text-xs font-extrabold px-3.5 py-2 rounded-xl bg-orange-50 text-orange-600 border border-orange-200 hover:bg-orange-100 transition">
            + Tambah Paket
          </button>
        </div>

        <div id="paket-editor-list" class="space-y-3"></div>
      </div>

      <p id="setting-error" class="text-xs font-bold text-rose-500 hidden"></p>

      <button type="submit"
        class="w-full bg-gradient-to-br from-orange-400 to-orange-600 hover:from-orange-500 hover:to-orange-700 active:scale-[0.98] text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-lg shadow-orange-500/30 transition">
        💾 Simpan Pengaturan Landing Page
      </button>
    </form>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    (function() {
      var firebaseConfig = {
        apiKey: "AIzaSyDmBlSBdeVPRO-AeUPQPEpDJzOLVE6fLUE",
        authDomain: "mega-math-bimbel.firebaseapp.com",
        projectId: "mega-math-bimbel",
        storageBucket: "mega-math-bimbel.firebasestorage.app",
        messagingSenderId: "1018677380626",
        appId: "1:1018677380626:web:0f37cc89072d1816b57acb",
        measurementId: "G-X3JBT00B7L"
      };

      var ADMIN_SESSION_KEY = "bimbel_admin_session";

      firebase.initializeApp(firebaseConfig);
      var db = firebase.firestore();

      var currentAdmin = null;
      var hasLoadedSetting = false;

      var DEFAULT_LANDING = {
        badgePromo: "Bimbel Private Ramah Anak • SD, SMP & SMA",
        judulHero: "Matematika Jadi Lebih Mudah Dipahami & Nggak Bikin Anak Takut Salah",
        subjudulHero: "Pendampingan belajar personal yang disesuaikan dengan ritme anak. Orang tua juga bisa memantau rekap pertemuan dan status pembayaran secara transparan lewat portal siswa.",
        ctaWaTeks: "Halo Admin Mega Math, saya ingin tanya info paket & pendaftaran bimbel.",
        paketList: [
          {
            id: "pkg-1",
            namaPaket: "Paket Hemat 4x Sesi",
            targetKelas: "SD / SMP / SMA",
            hargaPerSesi: 100000,
            jumlahSesi: 4,
            deskripsi: "Cocok untuk kenalan dengan metode belajar Mega Math, bantu selesaikan PR sekolah, atau memantapkan 1–2 topik yang sedang bikin bingung.",
            badge: "Pilihan Awal",
            unggulan: false
          },
          {
            id: "pkg-2",
            namaPaket: "Paket Reguler 8x Sesi",
            targetKelas: "SD / SMP / SMA",
            hargaPerSesi: 100000,
            jumlahSesi: 8,
            deskripsi: "Pilihan paling pas untuk belajar rutin mingguan agar konsep makin nempel, latihan soal lebih terarah, dan nilai harian lebih terjaga.",
            badge: "Paling Diminati",
            unggulan: true
          }
        ]
      };

      var paketItems = [];

      function setLoading(show, text) {
        var el = document.getElementById("loader");
        var txt = document.getElementById("loader-text");
        if (txt && text) txt.textContent = text;
        if (!el) return;
        if (show) {
          el.classList.remove("hidden");
          el.classList.add("flex");
        } else {
          el.classList.add("hidden");
          el.classList.remove("flex");
        }
      }

      function showNotif(icon, title, message) {
        document.getElementById("notif-icon").textContent = icon || "✅";
        document.getElementById("notif-title").textContent = title || "Informasi";
        document.getElementById("notif-message").textContent = message || "";
        var modal = document.getElementById("modal-notif");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      }

      function closeNotif() {
        var modal = document.getElementById("modal-notif");
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }

      function readAdminSession() {
        try {
          var raw = localStorage.getItem(ADMIN_SESSION_KEY) || sessionStorage.getItem(ADMIN_SESSION_KEY);
          if (!raw) return null;
          var parsed = JSON.parse(raw);
          if (!parsed || !parsed.id) return null;
          return {
            id: String(parsed.id).trim().toUpperCase(),
            nama: String(parsed.nama || parsed.id).trim()
          };
        } catch (e) {
          return null;
        }
      }

      function saveAdminSession(adminObj) {
        var clean = {
          id: String(adminObj && adminObj.id ? adminObj.id : "").trim().toUpperCase(),
          nama: String(adminObj && adminObj.nama ? adminObj.nama : "").trim()
        };
        try {
          localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(clean));
          sessionStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(clean));
        } catch (e) {}
        return clean;
      }

      function clearAdminSession() {
        currentAdmin = null;
        try {
          localStorage.removeItem(ADMIN_SESSION_KEY);
          sessionStorage.removeItem(ADMIN_SESSION_KEY);
        } catch (e) {}
      }

      function showLoginAdminView(errMessage) {
        currentAdmin = null;
        hasLoadedSetting = false;
        document.getElementById("view-pengaturan-landing").classList.add("hidden");
        document.getElementById("view-login-admin").classList.remove("hidden");
        document.getElementById("view-login-admin").classList.add("flex");

        var errEl = document.getElementById("admin-login-error");
        if (errMessage) {
          errEl.textContent = errMessage;
          errEl.classList.remove("hidden");
        } else {
          errEl.textContent = "";
          errEl.classList.add("hidden");
        }
      }

      function enterLandingSettingView(adminObj) {
        currentAdmin = saveAdminSession(adminObj);
        document.getElementById("admin-session-info").textContent = currentAdmin.id + " • " + currentAdmin.nama;

        document.getElementById("view-login-admin").classList.add("hidden");
        document.getElementById("view-login-admin").classList.remove("flex");
        document.getElementById("view-pengaturan-landing").classList.remove("hidden");

        if (!hasLoadedSetting) {
          hasLoadedSetting = true;
          loadLandingSetting();
        }
      }

      function syncFromAdminSession() {
        var sess = readAdminSession();
        if (!sess) {
          showLoginAdminView("");
          return;
        }

        enterLandingSettingView(sess);

        db.collection("admin").doc(sess.id).get()
          .then(function(doc) {
            if (!doc.exists) {
              clearAdminSession();
              showLoginAdminView("ID Admin tidak ditemukan.");
              return;
            }
            var a = doc.data() || {};
            if (a.aktif === false) {
              clearAdminSession();
              showLoginAdminView("Akun admin sedang nonaktif.");
              return;
            }
            enterLandingSettingView({
              id: String(a.id || doc.id),
              nama: String(a.nama || sess.nama || doc.id)
            });
          })
          .catch(function() {});
      }

      function handleLoginAdmin(event) {
        event.preventDefault();
        var adminId = String(document.getElementById("admin-id-input").value || "").trim().toUpperCase();
        var pass = String(document.getElementById("admin-pass-input").value || "");
        var errEl = document.getElementById("admin-login-error");
        errEl.classList.add("hidden");

        setLoading(true, "Memverifikasi akun admin...");
        db.collection("admin").doc(adminId).get()
          .then(function(doc) {
            setLoading(false);
            if (!doc.exists) {
              errEl.textContent = "ID Admin tidak ditemukan.";
              errEl.classList.remove("hidden");
              return;
            }
            var a = doc.data() || {};
            if (a.aktif === false) {
              errEl.textContent = "Akun admin sedang nonaktif.";
              errEl.classList.remove("hidden");
              return;
            }
            if (String(a.password || "") !== pass) {
              errEl.textContent = "Password admin salah.";
              errEl.classList.remove("hidden");
              return;
            }
            document.getElementById("admin-pass-input").value = "";
            enterLandingSettingView({
              id: String(a.id || doc.id),
              nama: String(a.nama || doc.id)
            });
          })
          .catch(function() {
            setLoading(false);
            errEl.textContent = "Gagal menghubungi Firestore.";
            errEl.classList.remove("hidden");
          });
      }

      function syncItemsFromDom() {
        var rows = document.querySelectorAll("[data-paket-row]");
        paketItems = [];
        rows.forEach(function(row, idx) {
          paketItems.push({
            id: row.getAttribute("data-paket-id") || ("pkg-" + (idx + 1)),
            namaPaket: String(row.querySelector(".pkg-nama").value || "").trim(),
            targetKelas: String(row.querySelector(".pkg-kelas").value || "").trim(),
            hargaPerSesi: Number(row.querySelector(".pkg-harga").value || 0),
            jumlahSesi: Number(row.querySelector(".pkg-sesi").value || 0),
            badge: String(row.querySelector(".pkg-badge").value || "").trim(),
            deskripsi: String(row.querySelector(".pkg-desc").value || "").trim(),
            unggulan: !!row.querySelector(".pkg-unggulan").checked
          });
        });
      }

      function renderPaketEditor() {
        var container = document.getElementById("paket-editor-list");
        container.textContent = "";

        paketItems.forEach(function(pkg, index) {
          var box = document.createElement("div");
          box.setAttribute("data-paket-row", "1");
          box.setAttribute("data-paket-id", pkg.id || ("pkg-" + (index + 1)));
          box.className = "p-4 rounded-2xl bg-orange-50/40 border border-orange-200 space-y-3";

          var head = document.createElement("div");
          head.className = "flex items-center justify-between gap-2";

          var labelTitle = document.createElement("span");
          labelTitle.className = "font-extrabold text-slate-800";
          labelTitle.textContent = "Paket #" + (index + 1);

          var rightHead = document.createElement("div");
          rightHead.className = "flex items-center gap-3";

          var unggulanLabel = document.createElement("label");
          unggulanLabel.className = "inline-flex items-center gap-1.5 font-extrabold text-orange-700 cursor-pointer";
          var unggulanCb = document.createElement("input");
          unggulanCb.type = "checkbox";
          unggulanCb.className = "pkg-unggulan rounded border-orange-300 text-orange-600";
          unggulanCb.checked = !!pkg.unggulan;
          unggulanLabel.appendChild(unggulanCb);
          unggulanLabel.appendChild(document.createTextNode("Paket Unggulan"));

          var btnHapus = document.createElement("button");
          btnHapus.type = "button";
          btnHapus.className = "text-xs font-extrabold text-rose-600 hover:underline";
          btnHapus.textContent = "Hapus";
          btnHapus.addEventListener("click", function() {
            syncItemsFromDom();
            if (paketItems.length <= 1) {
              showNotif("⚠️", "Minimal 1 Paket", "Sisakan minimal satu paket agar daftar harga tetap tampil.");
              return;
            }
            paketItems.splice(index, 1);
            renderPaketEditor();
          });

          rightHead.appendChild(unggulanLabel);
          rightHead.appendChild(btnHapus);
          head.appendChild(labelTitle);
          head.appendChild(rightHead);

          var g1 = document.createElement("div");
          g1.className = "grid grid-cols-1 sm:grid-cols-2 gap-2.5";
          g1.innerHTML =
            '<input type="text" required placeholder="Nama Paket (misal: Paket 8x Pertemuan)" value="' + String(pkg.namaPaket || "").replace(/"/g, "&quot;") + '" ' +
            'class="pkg-nama w-full px-3 py-2 rounded-xl bg-white border border-orange-200 font-bold text-slate-800">' +
            '<input type="text" required placeholder="Jenjang / Target (misal: SD / SMP)" value="' + String(pkg.targetKelas || "").replace(/"/g, "&quot;") + '" ' +
            'class="pkg-kelas w-full px-3 py-2 rounded-xl bg-white border border-orange-200 font-bold text-slate-800">';

          var g2 = document.createElement("div");
          g2.className = "grid grid-cols-1 sm:grid-cols-3 gap-2.5";
          g2.innerHTML =
            '<input type="number" min="1000" step="1000" required placeholder="Biaya / Sesi (Rp)" value="' + Number(pkg.hargaPerSesi || 100000) + '" ' +
            'class="pkg-harga w-full px-3 py-2 rounded-xl bg-white border border-orange-200 font-bold text-slate-800">' +
            '<input type="number" min="1" max="100" step="1" required placeholder="Jumlah Sesi" value="' + Number(pkg.jumlahSesi || 4) + '" ' +
            'class="pkg-sesi w-full px-3 py-2 rounded-xl bg-white border border-orange-200 font-bold text-slate-800">' +
            '<input type="text" placeholder="Label Badge (opsional)" value="' + String(pkg.badge || "").replace(/"/g, "&quot;") + '" ' +
            'class="pkg-badge w-full px-3 py-2 rounded-xl bg-white border border-orange-200 font-bold text-slate-800">';

          var descInput = document.createElement("input");
          descInput.type = "text";
          descInput.placeholder = "Deskripsi singkat paket";
          descInput.value = pkg.deskripsi || "";
          descInput.className = "pkg-desc w-full px-3 py-2 rounded-xl bg-white border border-orange-200 font-semibold text-slate-800";

          box.appendChild(head);
          box.appendChild(g1);
          box.appendChild(g2);
          box.appendChild(descInput);
          container.appendChild(box);
        });
      }

      function loadLandingSetting() {
        setLoading(true, "Memuat pengaturan landing page...");
        db.collection("pengaturan").doc("landing").get()
          .then(function(doc) {
            setLoading(false);
            var d = doc.exists ? Object.assign({}, DEFAULT_LANDING, doc.data()) : DEFAULT_LANDING;
            document.getElementById("set-badge-promo").value = d.badgePromo || "";
            document.getElementById("set-cta-wa").value = d.ctaWaTeks || "";
            document.getElementById("set-judul-hero").value = d.judulHero || "";
            document.getElementById("set-subjudul-hero").value = d.subjudulHero || "";
            paketItems = Array.isArray(d.paketList) && d.paketList.length > 0
              ? d.paketList.slice()
              : DEFAULT_LANDING.paketList.slice();
            renderPaketEditor();
          })
          .catch(function() {
            setLoading(false);
            paketItems = DEFAULT_LANDING.paketList.slice();
            renderPaketEditor();
          });
      }

      function handleSaveLanding(event) {
        event.preventDefault();
        if (!readAdminSession()) {
          showLoginAdminView("Sesi admin berakhir. Silakan masuk kembali.");
          return;
        }

        syncItemsFromDom();

        var errEl = document.getElementById("setting-error");
        errEl.classList.add("hidden");

        var badgePromo = String(document.getElementById("set-badge-promo").value || "").trim();
        var ctaWaTeks = String(document.getElementById("set-cta-wa").value || "").trim();
        var judulHero = String(document.getElementById("set-judul-hero").value || "").trim();
        var subjudulHero = String(document.getElementById("set-subjudul-hero").value || "").trim();

        if (!judulHero || paketItems.length === 0) {
          errEl.textContent = "Judul utama dan minimal satu paket wajib diisi.";
          errEl.classList.remove("hidden");
          return;
        }

        setLoading(true, "Menyimpan pengaturan...");
        db.collection("pengaturan").doc("landing").set({
          badgePromo: badgePromo,
          ctaWaTeks: ctaWaTeks,
          judulHero: judulHero,
          subjudulHero: subjudulHero,
          paketList: paketItems
        }, { merge: true })
          .then(function() {
            setLoading(false);
            showNotif("🌐", "Tersimpan", "Pengaturan landing page dan daftar paket berhasil diperbarui.");
          })
          .catch(function(err) {
            setLoading(false);
            errEl.textContent = "Gagal menyimpan pengaturan: " + (err && err.message ? err.message : "periksa koneksi atau aturan Firestore.");
            errEl.classList.remove("hidden");
          });
      }

      document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("btn-tutup-notif").addEventListener("click", closeNotif);
        document.getElementById("form-login-admin").addEventListener("submit", handleLoginAdmin);
        document.getElementById("btn-logout-admin").addEventListener("click", function() {
          clearAdminSession();
          window.location.href = "admin.html";
        });
        document.getElementById("btn-tambah-paket").addEventListener("click", function() {
          syncItemsFromDom();
          paketItems.push({
            id: "pkg-" + Date.now(),
            namaPaket: "",
            targetKelas: "SD / SMP / SMA",
            hargaPerSesi: 100000,
            jumlahSesi: 4,
            deskripsi: "",
            badge: "",
            unggulan: false
          });
          renderPaketEditor();
        });
        document.getElementById("form-landing-setting").addEventListener("submit", handleSaveLanding);

        syncFromAdminSession();
      });

      window.addEventListener("storage", function(e) {
        if (e.key === ADMIN_SESSION_KEY) {
          syncFromAdminSession();
        }
      });

      window.addEventListener("pageshow", function() {
        syncFromAdminSession();
      });

      document.addEventListener("visibilitychange", function() {
        if (!document.hidden) {
          syncFromAdminSession();
        }
      });
    })();
  </script>
</body>
</html>
